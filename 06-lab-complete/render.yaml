# Render Blueprint — agent (Docker) + Redis-compatible Key Value
# Render đọc blueprint ở gốc repo; nếu dùng file này, chỉ định đường dẫn
# 06-lab-complete/render.yaml khi tạo Blueprint.
services:
  - type: web
    name: production-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false            # nhập trên dashboard, không ghi trong repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: agent-redis
    plan: free
    ipAllowList: []            # chỉ truy cập từ mạng nội bộ của Render
